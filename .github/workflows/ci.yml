name: CI & Pages

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Unit tests, smoke (stable), app flow and basemap
        run: npm test
      - name: Smoke (extended, workers)
        run: npm run test:extended
      - name: Build
        run: npm run build
      - name: Smoke, app flow and formats against the built site
        run: node tests/run-smoke.mjs --root dist && node tests/app-flow.mjs --root dist && node tests/formats-io.mjs --root dist
      - name: Offline (service worker) against the built site
        run: node tests/run-smoke.mjs --offline --root dist
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Cloudflare Workers (archivos estáticos): alojamiento en la raíz de un dominio,
  # necesario para la app de Google Play (/.well-known/assetlinks.json). Sólo en
  # main, tras pasar las pruebas, y sólo si el repositorio tiene los secretos
  # CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID (si faltan, se salta).
  deploy-cloudflare:
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Cloudflare secrets present?
        id: secrets
        run: echo "ready=${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Build and deploy
        if: steps.secrets.outputs.ready == 'true'
        run: |
          npm ci
          npm run build
          npx --yes wrangler@4.151.3 deploy | tee "$RUNNER_TEMP/wrangler.log"
      # Comprueba el sitio publicado, no sólo que wrangler terminó: la raíz y las
      # páginas se sirven sin redirecciones (el precache del service worker las
      # pide tal cual), lo que decide la versión no se cachea y version.json es
      # el de este commit. El sello tarda unos segundos en propagarse.
      - name: Verify the live site
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -euo pipefail
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/wrangler.log" | head -1)
          test -n "$url" || { echo "::error::wrangler no informó de la URL publicada"; exit 1; }
          want=${GITHUB_SHA::7}
          for i in $(seq 1 24); do
            got=$(curl -fsS "$url/version.json" | jq -r .sha || true)
            [ "$got" = "$want" ] && break
            sleep 5
          done
          [ "$got" = "$want" ] || { echo "::error::$url/version.json sirve '$got', se esperaba '$want'"; exit 1; }
          check() { # ruta, cabecera esperada (regex, sin distinguir mayúsculas)
            headers=$(curl -sS -o /dev/null -D - "$url$1")
            echo "$headers" | head -1 | grep -q ' 200' || { echo "::error::$1 no devuelve 200"; echo "$headers"; exit 1; }
            echo "$headers" | grep -qiE "$2" || { echo "::error::$1 sin '$2'"; echo "$headers"; exit 1; }
          }
          check /              '^content-type: text/html'
          check /index.html    '^cache-control: no-cache'
          check /privacy.html  '^content-type: text/html'
          check /sw.js         '^cache-control: no-cache'
          check /manifest.json '^cache-control: no-cache'
          check /version.json  '^cache-control: no-store'
          check /.well-known/assetlinks.json '^content-type: application/json'
          # La app Android sólo abre a pantalla completa con estas huellas publicadas.
          curl -fsS "$url/.well-known/assetlinks.json" | jq -S . > "$RUNNER_TEMP/assetlinks.live.json"
          jq -S . .well-known/assetlinks.json | diff - "$RUNNER_TEMP/assetlinks.live.json" || { echo "::error::assetlinks.json publicado distinto del repositorio"; exit 1; }
          sw=$(curl -fsS "$url/sw.js")
          grep -q "const BUILD = '$want-" <<<"$sw" || { echo "::error::sw.js sin sello de build"; exit 1; }
          echo "Publicado y verificado: $url ($want)"
