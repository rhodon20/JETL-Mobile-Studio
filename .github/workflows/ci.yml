name: CI & Pages

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Unit tests, smoke (stable), app flow and basemap
        run: npm test
      - name: Smoke (extended, workers)
        run: npm run test:extended
      - name: Build
        run: npm run build
      - name: Smoke and app flow against the built site
        run: node tests/run-smoke.mjs --root dist && node tests/app-flow.mjs --root dist
      - name: Offline (service worker) against the built site
        run: node tests/run-smoke.mjs --offline --root dist
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Cloudflare Workers (archivos estáticos): alojamiento en la raíz de un dominio,
  # necesario para la app de Google Play (/.well-known/assetlinks.json). Sólo en
  # main, tras pasar las pruebas, y sólo si el repositorio tiene los secretos
  # CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID (si faltan, se salta).
  deploy-cloudflare:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Cloudflare secrets present?
        id: secrets
        run: echo "ready=${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Build and deploy
        if: steps.secrets.outputs.ready == 'true'
        run: |
          npm ci
          npm run build
          npx --yes wrangler@4.151.3 deploy
